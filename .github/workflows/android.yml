name: Build Voter Search APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Supports either a normal source checkout or a repository containing
      # the supplied VoterSearchApp ZIP archive.
      - name: Locate Android project
        shell: bash
        run: |
          if [[ ! -f settings.gradle.kts && ! -f settings.gradle ]]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"
            if [[ -n "$ZIP_FILE" ]]; then
              mkdir -p .build-source
              unzip -q "$ZIP_FILE" -d .build-source
            fi
          fi

          PROJECT_DIR="$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' -not -path './.gradle/*' -printf '%h\n' | head -n 1)"
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts."
            echo "Commit the extracted Android project files, or place the source ZIP in the repository."
            find . -maxdepth 4 -type f | sort | head -n 200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Verify Android Gradle files
        run: |
          test -f "$PROJECT_DIR/settings.gradle.kts" -o -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle"

      - name: Build debug APK
        run: gradle --project-dir "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoterSearch-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
